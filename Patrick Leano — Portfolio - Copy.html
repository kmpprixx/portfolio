<title>Patrick Leano — Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050a10;--ink:#e8f4fb;--mute:#8fa6b6;--line:#16283a;--acc:#46c8ff;--card:#0a1420;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.6 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Arial Black",sans-serif;line-height:1.05;margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
header{padding:72px 0 40px}
header h1{font-size:clamp(2.6rem,8vw,5.5rem);font-weight:800;letter-spacing:-.03em}
header p{color:var(--mute);max-width:48ch;font-size:1.15rem;margin:16px 0 0}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 32px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 0;z-index:5}
.tabs button{all:unset;cursor:pointer;padding:8px 18px;border:1px solid var(--line);border-radius:999px;color:var(--mute)}
.tabs button:hover{color:var(--ink)}
.tabs button:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.tabs button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#02121c;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;min-height:40vh}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.media{aspect-ratio:16/10;background:#000;display:grid;place-items:center;color:rgba(255,255,255,.6);overflow:hidden}
.media video{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:18px}
.body h3{font-size:1.3rem;margin-bottom:6px}
.body p{margin:0;color:var(--mute);font-size:.97rem}
.meta{margin-top:12px;font-size:.88rem;color:var(--acc)}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.badge{display:inline-block;background:#0b1d2c;border:1px solid var(--acc);color:var(--acc);border-radius:999px;padding:2px 10px;font-size:.82rem;margin-bottom:10px}
.visit{display:inline-block;margin-top:14px;color:var(--acc);font-weight:600}
.media{text-align:center;padding:12px}
.wave{display:flex;align-items:center;gap:3px;height:60%}
.wave i{width:4px;background:rgba(255,255,255,.75);border-radius:2px}
.empty{color:var(--mute);grid-column:1/-1}
.contact{padding:96px 0 64px;border-top:1px solid var(--line);margin-top:64px}
.contact h2{font-size:clamp(2rem,6vw,3.6rem);font-weight:800;margin-bottom:12px}
.contact a.mail{color:var(--acc);font-family:"Bricolage Grotesque",sans-serif;font-size:1.5rem}
.links{display:flex;gap:20px;margin-top:20px;color:var(--mute);flex-wrap:wrap}
</style>
</head>

const PROJECTS=[
 {cat:'Game Projects',badge:'Current project',t:'Nova Aetheris',d:'My latest project: a 3D multiplayer MMORPG.',tags:'Godot',media:'video2'},
 {cat:'3D Modelling',badge:'Latest model',t:'Blocky pig',d:'A low-poly pig.',tags:'Blender',media:'img'},
 {cat:'Shaders',t:'Real-time liquid in Godot',d:'Particle-based (SPH) water.',tags:'Godot 4 · GDScript · SPH · C++',media:'video'},
 {cat:'Servers & Hosting',t:'Pokémon Showdown server and client',d:'I hosted both the Pokémon Showdown server and its web client on a VPS. I handled the deployment and configuration. The Showdown software is open source, so I didn’t build the site itself.',tags:'VPS · Node.js · DuckDNS',g:['#0d2b3b','#1f6f5c'],label:'pokemonshowdownclient.duckdns.org',link:'https://pokemonshowdownclient.duckdns.org/'}];
const tabs=document.getElementById('tabs'),grid=document.getElementById('grid');
let cur='All';
function bars(){let s='<div class="wave" aria-hidden="true">';for(let i=0;i<28;i++)s+='<i style="height:'+(15+Math.abs(Math.sin(i*1.7)*70)|0)+'%"></i>';return s+'</div>'}
function render(){
 [...tabs.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.c==cur));
 const list=PROJECTS.filter(p=>cur=='All'||p.cat==cur);
 grid.innerHTML=list.length?'':'<p class="empty">Nothing here yet.</p>';
 list.forEach(p=>{const a=document.createElement('article');a.className='card';
  const vid=s=>'<video src="'+s+'" autoplay muted loop playsinline controls></video>';
  const m=p.media=='video'?vid(VIDEO):p.media=='video2'?vid(VIDEO2):p.media=='img'?'<img src="'+PIG+'" alt="'+p.t+'">':p.media=='audio'?bars():(p.label||p.cat);
  const bg=p.g?'background:linear-gradient(135deg,'+p.g[0]+','+p.g[1]+')':p.media=='audio'?'background:linear-gradient(135deg,#1a1230,#3b2a6b)':'';
  a.innerHTML='<div class="media" style="'+bg+'">'+m+'</div><div class="body">'+(p.badge?'<span class="badge">'+p.badge+'</span>':'')+'<h3>'+p.t+'</h3><p>'+p.d+'</p><div class="meta">'+p.cat+' · '+p.tags+'</div>'+(p.link?'<a class="visit" href="'+p.link+'" target="_blank" rel="noopener">Visit live site</a>':'')+'</div>';

}
['All',...CATS].forEach(c=>{const b=document.createElement('button');b.textContent=c;b.dataset.c=c;b.onclick=()=>{cur=c;render()};tabs.appendChild(b)});
